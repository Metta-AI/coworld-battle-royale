# NOTE: the upload workflow (upload-coworld-battleroyale.yml) triggers via workflow_run
# on this workflow's NAME. Renaming "Github Actions" silently stops all
# league uploads — update that file in the same commit if you rename it.
name: Github Actions
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libudev-dev libevdev-dev
      - uses: treeform/setup-nim-action@v6
      - name: Install pinned Nimby 0.1.26
        run: |
          set -euo pipefail
          curl -fsSL \
            -o "$RUNNER_TEMP/nimby" \
            https://github.com/treeform/nimby/releases/download/0.1.26/nimby-Linux-X64
          chmod +x "$RUNNER_TEMP/nimby"
          nim_version="$(nim --version | sed -n 's/^Nim Compiler Version \([^ ]*\).*/\1/p')"
          test -n "$nim_version"
          "$RUNNER_TEMP/nimby" use "$nim_version"
          echo "$HOME/.nimby/nim/bin" >> "$GITHUB_PATH"
      - run: "$RUNNER_TEMP/nimby" --global sync nimby.lock
      # Reuse compiled C objects across runs: the release build of the deps
      # (pixie et al.) dominates the compile step and rarely changes. The key
      # includes the commit so every run saves a fresh cache; restore falls
      # back to the newest cache for the same dependency lock.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/nim
          key: nimcache-${{ runner.os }}-${{ hashFiles('nimby.lock') }}-${{ github.sha }}
          restore-keys: |
            nimcache-${{ runner.os }}-${{ hashFiles('nimby.lock') }}-
      - run: nim check src/ctf.nim
      - name: Compile test shards (release)
        run: |
          for i in 1 2 3 4; do
            nim c -d:release --hints:off -o:shard_$i tests/shard_$i.nim &
            eval "pid_$i=\$!"
          done
          fail=0
          for i in 1 2 3 4; do
            eval "wait \$pid_$i" || fail=1
          done
          exit $fail
      - name: Run test shards in parallel
        run: |
          for i in 1 2 3 4; do
            ./shard_$i > shard_$i.log 2>&1 &
            eval "pid_$i=\$!"
          done
          fail=0
          for i in 1 2 3 4; do
            eval "wait \$pid_$i" || fail=1
          done
          for i in 1 2 3 4; do
            echo "::group::shard $i"
            cat shard_$i.log
            echo "::endgroup::"
          done
          exit $fail
  arena-wasm:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: treeform/setup-nim-action@v6
        with:
          nim-version: 2.2.6
      - name: Install pinned Nimby 0.1.26
        run: |
          set -euo pipefail
          curl -fsSL \
            -o "$RUNNER_TEMP/nimby" \
            https://github.com/treeform/nimby/releases/download/0.1.26/nimby-Linux-X64
          chmod +x "$RUNNER_TEMP/nimby"
          nim_version="$(nim --version | sed -n 's/^Nim Compiler Version \([^ ]*\).*/\1/p')"
          test -n "$nim_version"
          "$RUNNER_TEMP/nimby" use "$nim_version"
          echo "$HOME/.nimby/nim/bin" >> "$GITHUB_PATH"
      - run: "$RUNNER_TEMP/nimby" --global sync nimby.lock
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo
            ~/.rustup
          key: arena-toolchain-${{ runner.os }}-${{ hashFiles('arena/wit/**/*.wit') }}
      - name: Install pinned Arena toolchain
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/arena-toolchain"
          mkdir -p "$root"
          rustup toolchain install stable --profile minimal
          rustup target add --toolchain stable wasm32-wasip1
          curl -fL --retry 3 \
            -o "$root/wasi-sdk.tar.gz" \
            https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-33/wasi-sdk-33.0-x86_64-linux.tar.gz
          mkdir "$root/sdk"
          tar -xzf "$root/wasi-sdk.tar.gz" -C "$root/sdk"
          export WASI_SDK_PATH="$root/sdk/wasi-sdk-33.0-x86_64-linux"
          cargo +stable install wit-bindgen-cli --version 0.60.0 --locked \
            --root "$root/wit-bindgen"
          cargo +stable install wasm-tools --version 1.255.0 --locked \
            --root "$root/wasm-tools"
          curl -fL --retry 3 \
            -o "$root/wasi-vfs.zip" \
            https://github.com/kateinoigakukun/wasi-vfs/releases/download/v0.6.3/wasi-vfs-cli-x86_64-unknown-linux-gnu.zip
          mkdir "$root/wasi-vfs"
          unzip -q "$root/wasi-vfs.zip" -d "$root/wasi-vfs"
          git clone --depth 1 --branch v0.6.3 --recurse-submodules \
            https://github.com/kateinoigakukun/wasi-vfs.git "$root/wasi-vfs-src"
          CFLAGS_wasm32_wasip1="--sysroot=$WASI_SDK_PATH/share/wasi-sysroot" \
            WASI_SDK_PATH="$WASI_SDK_PATH" \
            cargo +stable build \
              --manifest-path "$root/wasi-vfs-src/Cargo.toml" \
              --target wasm32-wasip1 --release
          {
            echo "WASI_SDK_PATH=$WASI_SDK_PATH"
            echo "WIT_BINDGEN=$root/wit-bindgen/bin/wit-bindgen"
            echo "WASM_TOOLS=$root/wasm-tools/bin/wasm-tools"
            echo "WASI_VFS=$root/wasi-vfs/wasi-vfs"
            echo "WASI_VFS_LIB=$root/wasi-vfs-src/target/wasm32-wasip1/release/libwasi_vfs.a"
            echo "WASI_ADAPTER=$root/wasi-adapter.wasm"
            echo "PATH=$HOME/.nimby/nim/bin:$PATH"
          } >> "$GITHUB_ENV"
          curl -fL --retry 3 \
            -o "$root/wasi-adapter.wasm" \
            https://github.com/bytecodealliance/wasmtime/releases/download/v46.0.1/wasi_snapshot_preview1.reactor.wasm
      - name: Build and validate Arena components
        run: time arena/test.sh
  # The static replay viewer ships as wasm32: Nim `int` is 32 bits there
  # (overflow checks trap on math that is silently fine on 64-bit native)
  # and the address space ends at 2 GB. The native shards above can never
  # catch that class of bug — twice it reached prod and every hosted replay
  # hung on "WARMING UP" (PR #189). This job builds the EXACT bundle the
  # observatory serves (same pinned emsdk+nim via Dockerfile.replay-viewer)
  # and loads + steps real fixture replays inside the wasm runtime.
  wasm-replay-viewer:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Build the static replay viewer bundle
        run: |
          docker build --file Dockerfile.replay-viewer \
            --target replay-viewer-builder --tag ctf-replay-viewer-ci .
          id=$(docker create ctf-replay-viewer-ci)
          docker cp "$id":/workspace/ctf/replay-viewer/dist replay-viewer/dist
          docker rm "$id"
      # Pure-node client regression (no bundle needed): the sprite-protocol
      # parser must survive a failed band decode without desyncing, and the
      # failed band must self-heal from its retained compressed payload.
      - name: Client band decode-failure regression
        run: node tools/qa_band_desync.cjs
      - name: Smoke-run fixture replays in the wasm bundle
        # gen-colossal-4team is the address-space canary: a 4992x4992 board
        # only fits wasm32 because oversize boards emit at 1x (see
        # MaxSupersampledMapPixels). Re-record on GameVersion bumps with:
        #   tools/record_colossal_demo.sh <out> 4242 300 16
        run: |
          fail=0
          for replay in tests/replays/ctf.bitreplay \
              tests/fixtures/gen-small-pits.bitreplay \
              tests/fixtures/gen-colossal-4team.bitreplay; do
            echo "::group::$replay"
            node tools/wasm_replay_smoke.cjs replay-viewer/dist "$replay" 300 || fail=1
            echo "::endgroup::"
          done
          exit $fail
