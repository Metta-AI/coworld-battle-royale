name: Upload Coworld

# Builds the game, baseline-bot, and commissioner images via compose.yaml and
# uploads a new ctf version to Softmax (https://softmax.com/api) on every push
# to main, then re-uploads the same build as ctf-doubles so that league tracks
# the latest game version-for-version. The version is the latest uploaded ctf
# version with the patch bumped, unless an explicit version is passed via
# workflow_dispatch.
#
# Auth: the SOFTMAX_TOKEN repo secret — the non-expiring "coworld-ctf-ci"
# user credential (softmax.com/observatory/credentials). If it is ever
# revoked, mint a new credential on that page and run:
#   gh secret set SOFTMAX_TOKEN --repo Metta-AI/coworld-ctf

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      version:
        description: "Explicit game version (default: bump patch of latest uploaded ctf)"
        required: false

# One upload at a time; queued runs wait so version query/bump cannot race.
concurrency:
  group: upload-coworld
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: coworld-ctf
      # Commissioner build context; compose.yaml expects it as a sibling dir.
      - uses: actions/checkout@v5
        with:
          repository: Metta-AI/coworld-tools
          path: coworld-tools
      - uses: astral-sh/setup-uv@v6
      - uses: docker/setup-buildx-action@v3
      - name: Authenticate to Softmax
        run: uvx --from "coworld[auth]==0.1.34" softmax set-token "${{ secrets.SOFTMAX_TOKEN }}"
      - name: Determine version
        id: version
        run: |
          set -euo pipefail
          version="${{ inputs.version || '' }}"
          if [ -z "$version" ]; then
            version=$(uvx --from "coworld[auth]==0.1.34" coworld next-version ctf)
          fi
          echo "Uploading as ctf $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      # `coworld resolve-and-upload` was removed from the coworld CLI; the
      # replacement is the two-step flow: `build` (compose build + manifest
      # hydration from the template) then `upload-coworld` (registry push +
      # hosted smoke certification).
      - name: Build, certify, and upload
        working-directory: coworld-ctf
        env:
          COMMISSIONER_CONTEXT: ../coworld-tools/commissioners
        run: |
          uvx --from "coworld[auth]==0.1.34" coworld build \
            --version "${{ steps.version.outputs.version }}" \
            --project . \
            --compose compose.yaml \
            --template coworld_manifest.json \
            --output build/coworld-package/coworld_manifest.json
          uvx --from "coworld[auth]==0.1.34" coworld upload-coworld \
            build/coworld-package/coworld_manifest.json \
            --timeout-seconds 900 \
            --wait-hosted-smoke \
            --hosted-smoke-timeout-seconds 1800
      # ctf-doubles is this exact build seated 4 policies per episode (2 per
      # team, split by the same red/blue seat parity) — no separate game code.
      # Re-upload the hydrated package under the ctf-doubles identity at the
      # same version so the Ctf Doubles league always runs the latest ctf game.
      - name: Upload as ctf-doubles
        working-directory: coworld-ctf
        run: |
          python3 - <<'EOF'
          import json
          path = "build/coworld-package/coworld_manifest.json"
          manifest = json.load(open(path))
          game = manifest["game"]
          game["name"] = "ctf-doubles"
          game["description"] = (
              "CTF-Doubles: the standard 16-seat 8v8 CTF game, but each team is split in half "
              "between two entrant policies - 4 policies per episode, 4 agents each, allies you "
              "don't control. Coordination (shouts) matters double. Game rules are identical to "
              "ctf. " + game["description"]
          )
          manifest["tags"] = sorted(set(manifest.get("tags", []) + ["doubles"]))
          for commissioner in manifest.get("commissioner", []):
              if commissioner["id"] == "ctf-commissioner":
                  commissioner["id"] = "ctf-doubles-commissioner"
                  commissioner["name"] = "CTF Doubles Commissioner"
          json.dump(manifest, open(path, "w"), indent=2)
          EOF
          uvx --from "coworld[auth]==0.1.34" coworld upload-coworld \
            build/coworld-package/coworld_manifest.json \
            --timeout-seconds 900 \
            --wait-hosted-smoke \
            --hosted-smoke-timeout-seconds 1800
      - name: Verify upload
        run: |
          set -euo pipefail
          uvx --from "coworld[auth]==0.1.34" coworld list --json --limit 500 > /tmp/coworlds-after.json
          python3 - "${{ steps.version.outputs.version }}" <<'EOF'
          import json, sys
          expected = sys.argv[1]
          rows = json.load(open("/tmp/coworlds-after.json"))
          for name in ("ctf", "ctf-doubles"):
              match = [r for r in rows if r.get("name") == name and r.get("version") == expected]
              if not match:
                  raise SystemExit(f"uploaded {name} version {expected} not found on server")
              entry = match[0]
              if not entry.get("canonical"):
                  raise SystemExit(
                      f"{name}:{expected} uploaded but is not canonical; "
                      "the league will not advance. Hosted smoke certification likely did not pass."
                  )
              print(entry["id"], entry["name"], entry["version"], "canonical")
          EOF
