x-coworld-role-contexts:
  game: &game_context ${GAME_CONTEXT:-.}

services:
  game:
    image: coworld-battle-royale:latest
    platform: linux/amd64
    build:
      context: *game_context
      dockerfile: Dockerfile
      network: host
  player:
    image: coworld-battle-royale-baseline:latest
    platform: linux/amd64
    build:
      context: *game_context
      dockerfile: players/baseline/Dockerfile
      network: host
